services:
  mongo:
    image: mongo:7
    container_name: easytunr-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: easytunr-server
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017/easytunr
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      OMR_ENGINE: ${OMR_ENGINE:-clarity-omr}
      OMR_DEVICE: ${OMR_DEVICE:-cpu}
      OMR_CLARITY_REPO_PATH: ${OMR_CLARITY_REPO_PATH:-/app/clarity}
      OMR_CLARITY_PYTHON: ${OMR_CLARITY_PYTHON:-python}
      OMR_CLARITY_FAST: ${OMR_CLARITY_FAST:-true}
      OMR_MODEL_WEIGHTS: ${OMR_MODEL_WEIGHTS:-}
      OMR_CONFIDENCE: ${OMR_CONFIDENCE:-0.25}
      OMR_SEQ2SEQ_MODEL_ID: ${OMR_SEQ2SEQ_MODEL_ID:-clquwu/Clarity-OMR}
      OMR_SEQ2SEQ_MAX_NEW_TOKENS: ${OMR_SEQ2SEQ_MAX_NEW_TOKENS:-256}
      OMR_SEQ2SEQ_NUM_BEAMS: ${OMR_SEQ2SEQ_NUM_BEAMS:-2}
      OMR_STAFF_PROJECTION_FACTOR: ${OMR_STAFF_PROJECTION_FACTOR:-0.55}
      PORT: ${PORT:-5000}
    ports:
      - "5000:5000"
    volumes:
      - ./server/uploads:/app/uploads
      - ./server/clarity:/app/clarity
      - ./server/server.py:/app/server.py
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    restart: unless-stopped

volumes:
  mongo_data:
