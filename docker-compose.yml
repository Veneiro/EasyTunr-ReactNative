services:
  mongo:
    image: mongo:7
    container_name: easytunr-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: easytunr-server
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017/easytunr
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      OMR_MODEL_WEIGHTS: ${OMR_MODEL_WEIGHTS:-}
      OMR_CONFIDENCE: ${OMR_CONFIDENCE:-0.25}
      OMR_DEVICE: ${OMR_DEVICE:-cpu}
      PORT: ${PORT:-5000}
    ports:
      - "5000:5000"
    volumes:
      - ./server/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    restart: unless-stopped

volumes:
  mongo_data:
