services:
  mongo:
    image: mongo:7
    container_name: easytunr-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: easytunr-server
    depends_on:
      mongo:
        condition: service_healthy
    # JWT_SECRET_KEY y demas config salen de server/.env (wsl-up.sh lo crea si falta)
    env_file:
      - path: ./server/.env
        required: false
    environment:
      MONGO_URI: mongodb://mongo:27017/easytunr
    ports:
      - "5000:5000"
    volumes:
      - ./server/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    restart: unless-stopped

volumes:
  mongo_data:
